[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "VKRUST - Vibe Kernel in RUST"

[dependencies]
abi = { path = "../abi" }
x86_64 = "0.15"
pic8259 = "0.11"
pc-keyboard = "0.8"
spin = "0.9"
linked_list_allocator = "0.10"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = false
codegen-units = 1

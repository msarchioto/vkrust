<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img">
  <title>vkr-user from the machine up to the shell</title>
  <desc>QEMU with OVMF, then the UEFI loader, then the ring-0 kernel modules, the shared abi crate, and the ring-3 shell.</desc>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1c1917; }
    .title { font-size: 22px; font-weight: 650; }
    .sub { font-size: 14px; fill: #5c564e; }
    .label { font-size: 16px; font-weight: 650; }
    .small { font-size: 14px; }
    .on-dark { fill: #f6f3ec; }
    .mono { font-family: ui-monospace, "Cascadia Code", "Source Code Pro", monospace; font-size: 13px; }
  </style>
  <rect width="960" height="560" fill="#f6f3ec"/>
  <text class="title" x="40" y="42">How vkr-user is stacked</text>
  <text class="sub" x="40" y="66">One machine, one kernel, one ring-3 program</text>

  <rect x="40" y="88" width="880" height="56" rx="10" fill="#ece7df" stroke="#d9d1c5"/>
  <text class="label" x="60" y="122">Machine</text>
  <text class="small" x="180" y="122">QEMU with OVMF, or a PC with UEFI firmware</text>

  <rect x="40" y="160" width="880" height="72" rx="10" fill="#f8efe3" stroke="#e2c9a4"/>
  <text class="label" x="60" y="192">UEFI loader</text>
  <text class="small" x="60" y="214">BOOTX64.EFI reads \boot\kernel, maps it at 0xffffffff80000000, and jumps to kmain.</text>

  <rect x="40" y="248" width="880" height="148" rx="10" fill="#143d2c"/>
  <text class="label on-dark" x="60" y="278">Kernel, ring 0</text>
  <text class="small on-dark" x="230" y="278">monolithic, linked at 0xffffffff80000000</text>
  <g fill="#1f6b45">
    <rect x="60" y="296" width="130" height="36" rx="8"/><text class="small on-dark" x="96" y="319">boot</text>
    <rect x="202" y="296" width="130" height="36" rx="8"/><text class="small on-dark" x="230" y="319">memory</text>
    <rect x="344" y="296" width="130" height="36" rx="8"/><text class="small on-dark" x="386" y="319">gdt</text>
    <rect x="486" y="296" width="150" height="36" rx="8"/><text class="small on-dark" x="516" y="319">interrupts</text>
    <rect x="648" y="296" width="150" height="36" rx="8"/><text class="small on-dark" x="684" y="319">syscall</text>
    <rect x="60" y="344" width="130" height="36" rx="8"/><text class="small on-dark" x="104" y="367">vfs</text>
    <rect x="202" y="344" width="130" height="36" rx="8"/><text class="small on-dark" x="230" y="367">console</text>
    <rect x="344" y="344" width="130" height="36" rx="8"/><text class="small on-dark" x="380" y="367">input</text>
    <rect x="486" y="344" width="150" height="36" rx="8"/><text class="small on-dark" x="522" y="367">process</text>
    <rect x="648" y="344" width="150" height="36" rx="8"/><text class="small on-dark" x="686" y="367">serial</text>
  </g>

  <rect x="40" y="412" width="880" height="44" rx="10" fill="#1e4d6b"/>
  <text class="label on-dark" x="60" y="440">abi</text>
  <text class="small on-dark" x="120" y="440">syscall numbers, open flags, errno values, directory and stat records</text>

  <rect x="40" y="472" width="880" height="64" rx="10" fill="#e5f2ea" stroke="#b7d7c4"/>
  <text class="label" x="60" y="500">Shell, ring 3</text>
  <text class="small" x="200" y="500">one static ELF at 0x400000: ls, cd, mkdir, cp, mv, vim, and the rest of help</text>
  <text class="small" x="60" y="522">Builtins live in this program. There is no exec and no second process.</text>
</svg>
